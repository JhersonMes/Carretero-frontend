<div style="border: 1px solid #aaa; padding: 15px; margin: 15px 0; background: #fff;">
  <h3>{{ isEdit ? 'Editar Rol' : 'Nuevo Rol' }}</h3>
  <form (ngSubmit)="save()">
    <div class="form-group">
      <label for="role-name">Nombre:</label>
      <input id="role-name" type="text" [(ngModel)]="name" name="name" required>
    </div>
    <div class="form-group">
      <label for="role-description">Descripción:</label>
      <input id="role-description" type="text" [(ngModel)]="description" name="description">
    </div>
    <button type="submit">Guardar</button>
    <button type="button" routerLink="/pages/role">Cancelar</button>
  </form>
</div>
