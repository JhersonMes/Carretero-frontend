<div style="border: 1px solid #aaa; padding: 15px; margin: 15px 0; background: #fff;">
  <h3>{{ isEdit ? 'Editar Platillo' : 'Nuevo Platillo' }}</h3>
  <form (ngSubmit)="save()">
    <div class="form-group">
      <label for="menu-name">Nombre:</label>
      <input id="menu-name" type="text" [(ngModel)]="name" name="name" required>
    </div>
    <div class="form-group">
      <label for="menu-description">Descripción:</label>
      <input id="menu-description" type="text" [(ngModel)]="description" name="description">
    </div>
    <div class="form-group">
      <label for="menu-price">Precio (S/):</label>
      <input id="menu-price" type="number" step="0.5" [(ngModel)]="price" name="price" required>
    </div>
    <div class="form-group">
      <label for="menu-category">Categoría:</label>
      <input id="menu-category" type="text" [(ngModel)]="category" name="category" required>
    </div>
    <div class="form-group">
      <label>
        <input type="checkbox" [(ngModel)]="available" name="available"> Disponible
      </label>
    </div>
    <button type="submit">Guardar</button>
    <button type="button" routerLink="/pages/menu">Cancelar</button>
  </form>
</div>
