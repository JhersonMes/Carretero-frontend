<div class="modal-overlay" (click)="cancel()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <h2>{{ hasDishes ? 'Con que plato va?' : 'Que area lo prepara?' }}</h2>
    <p class="modal-hint">
      {{ product.name }} &middot;
      {{
        hasDishes
          ? 'sale a la misma area que el plato que elijas'
          : 'el pedido aun no tiene platos, elige el area'
      }}
    </p>

    <!-- Lo habitual: se elige el plato y el area sale de el -->
    <div class="dish-list" *ngIf="hasDishes">
      <button
        type="button"
        class="dish-option"
        *ngFor="let d of dishes"
        [class.selected]="selectedDish === d.name"
        (click)="selectDish(d)"
      >
        <span class="dish-name">{{ d.name }}</span>
        <span class="dish-area">{{ labelOf(d.station) }}</span>
      </button>
    </div>

    <!-- Sin platos a los que engancharse: se elige el area directamente -->
    <div class="dish-list" *ngIf="!hasDishes">
      <button
        type="button"
        class="dish-option"
        *ngFor="let s of stations"
        [class.selected]="selected === s.key"
        (click)="selectStation(s.key)"
      >
        <span class="dish-name">{{ s.label }}</span>
      </button>
    </div>

    <div class="modal-actions">
      <button type="button" class="secondary" (click)="cancel()">Cancelar</button>
      <button type="button" class="confirm-btn" [disabled]="!selected" (click)="confirm()">
        Agregar
      </button>
    </div>
  </div>
</div>
