<div class="modal-overlay" (click)="cancel()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <h2>Elige una opcion</h2>
    <p class="modal-hint">{{ product.name }}</p>

    @if (loading) {
      <p class="loading-msg">Cargando opciones...</p>
    }

    @if (!loading && flavors.length > 0) {
      <div class="flavor-grid">
        @for (flavor of flavors; track flavor) {
          <button
            type="button"
            class="flavor-option"
            [class.selected]="selected?.idFlavor === flavor.idFlavor"
            (click)="select(flavor)"
            >
            <span class="flavor-name">{{ flavor.name }}</span>
            @if (priceWith(flavor) > 0) {
              <span class="flavor-price">
                S/ {{ priceWith(flavor).toFixed(2) }}
              </span>
            }
          </button>
        }
      </div>
    }

    @if (errorMessage) {
      <div class="error-message">{{ errorMessage }}</div>
    }

    <div class="modal-actions">
      <button type="button" class="cancel-btn" (click)="cancel()">Cancelar</button>
      <button type="button" class="confirm-btn" [disabled]="!selected" (click)="confirm()">
        Agregar
      </button>
    </div>
  </div>
</div>
