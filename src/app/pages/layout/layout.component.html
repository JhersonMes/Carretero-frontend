<div class="app-shell">
  <header class="app-header">
    <div class="header-left">
      <button
        type="button"
        class="mobile-menu-btn"
        (click)="toggleMobileMenu()"
        aria-label="Abrir menú de navegación"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>

      <div class="brand">
        <app-logo class="brand-icon" [size]="44" [animated]="false" [showWordmark]="false" [showRing]="true"></app-logo>
        <div class="brand-text">
          <app-logo class="brand-name" [size]="140" [animated]="false" [showWordmark]="false" [textOnly]="true"></app-logo>
          <span class="brand-subtitle">Sistema de Ventas</span>
        </div>
      </div>
    </div>

    <div class="session-info" *ngIf="authService.currentUser() as user">
      <div class="session-details">
        <span class="session-name">{{ user.fullName || user.username }}</span>
        <span class="session-badge" [style.background]="roleDisplay(user.role.name).color">
          {{ roleDisplay(user.role.name).label }}
        </span>
      </div>
      <button type="button" class="logout-btn" (click)="logout()" title="Cerrar sesión">
        <span class="logout-text">Cerrar sesión</span>
        <svg class="logout-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </button>
    </div>
  </header>

  <!-- Telón de fondo para menú móvil -->
  <div class="sidebar-backdrop" *ngIf="isMobileMenuOpen" (click)="closeMobileMenu()"></div>

  <div class="app-body">
    <nav class="app-sidebar" [class.mobile-open]="isMobileMenuOpen">
      <div class="mobile-sidebar-header">
        <div class="mobile-sidebar-user" *ngIf="authService.currentUser() as user">
          <span class="mobile-sidebar-user-name">{{ user.fullName || user.username }}</span>
          <span class="mobile-sidebar-user-badge" [style.background]="roleDisplay(user.role.name).color">
            {{ roleDisplay(user.role.name).label }}
          </span>
        </div>
        <button type="button" class="mobile-sidebar-close" (click)="closeMobileMenu()" aria-label="Cerrar menú">
          &times;
        </button>
      </div>

      <ul>
        <li *ngFor="let item of navItems">
          <a [routerLink]="item.path" routerLinkActive="active" (click)="closeMobileMenu()">{{ item.label }}</a>
        </li>
      </ul>
    </nav>

    <main class="app-main">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
