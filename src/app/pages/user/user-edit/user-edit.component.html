<div style="border: 1px solid #aaa; padding: 15px; margin: 15px 0; background: #fff;">
  <h3>{{ isEdit ? 'Editar Usuario' : 'Nuevo Usuario' }}</h3>
  <form (ngSubmit)="save()">
    <div class="form-group">
      <label>Nombre de Usuario:</label>
      <input type="text" [(ngModel)]="username" name="username" required>
    </div>
    <div class="form-group">
      <label>Email:</label>
      <input type="email" [(ngModel)]="email" name="email" required>
    </div>
    <div class="form-group" *ngIf="!isEdit">
      <label>Contraseña:</label>
      <input type="password" [(ngModel)]="password" name="password" required>
    </div>
    <div class="form-group">
      <label>Rol:</label>
      <select [(ngModel)]="idRole" name="idRole" required>
        <option [value]="0">Seleccione un rol</option>
        <option *ngFor="let r of roles" [value]="r.idRole">{{ r.name }}</option>
      </select>
    </div>
    <button type="submit">Guardar</button>
    <button type="button" routerLink="/pages/user">Cancelar</button>
  </form>
</div>
