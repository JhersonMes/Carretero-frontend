<div style="border: 1px solid #aaa; padding: 15px; margin: 15px 0; background: #fff;">
  <h3>{{ isEdit ? 'Editar Usuario' : 'Nuevo Usuario' }}</h3>
  <p *ngIf="loading">Cargando datos de la cuenta...</p>
  <form (ngSubmit)="save()" *ngIf="!loading">
    <div class="form-group">
      <label for="username">Nombre de Usuario:</label>
      <input id="username" type="text" [(ngModel)]="username" name="username" required>
    </div>
    <div class="form-group">
      <label for="fullName">Nombre completo:</label>
      <input id="fullName" type="text" [(ngModel)]="fullName" name="fullName" placeholder="Ej. Ana Torres">
    </div>
    <div class="form-group">
      <label for="email">Email:</label>
      <input id="email" type="email" [(ngModel)]="email" name="email" required>
    </div>
    <div class="form-group">
      <label for="phone">Teléfono:</label>
      <input id="phone" type="tel" [(ngModel)]="phone" name="phone" maxlength="9" placeholder="9 dígitos">
    </div>
    <div class="form-group">
      <label for="password">{{ isEdit ? 'Nueva contraseña (déjala vacía para no cambiarla):' : 'Contraseña:' }}</label>
      <input id="password" type="password" [(ngModel)]="password" name="password" autocomplete="new-password" [required]="!isEdit">
    </div>
    <div class="form-group">
      <label for="idRole">Rol:</label>
      <select id="idRole" [(ngModel)]="idRole" name="idRole" required>
        <option [value]="0">Seleccione un rol</option>
        <option *ngFor="let r of roles" [value]="r.idRole">{{ r.name }}</option>
      </select>
    </div>
    <p class="form-error" *ngIf="errorMessage" style="color: var(--carretero-red-dark); font-size: 0.86rem;">{{ errorMessage }}</p>
    <button type="submit">Guardar</button>
    <button type="button" routerLink="/pages/user">Cancelar</button>
  </form>
</div>
