<div style="border: 1px solid #aaa; padding: 15px; margin: 15px 0; background: #fff;">
  <h3>{{ isEdit ? 'Editar Ingrediente' : 'Nuevo Ingrediente' }}</h3>
  <form (ngSubmit)="save()">
    <div class="form-group">
      <label for="ingredient-name">Nombre:</label>
      <input id="ingredient-name" type="text" [(ngModel)]="name" name="name" required>
    </div>
    <div class="form-group">
      <label for="ingredient-stock">Stock:</label>
      <input id="ingredient-stock" type="number" [(ngModel)]="stock" name="stock" required>
    </div>
    <div class="form-group">
      <label for="ingredient-unit">Unidad de Medida:</label>
      <input id="ingredient-unit" type="text" [(ngModel)]="unit" name="unit" placeholder="Ej. kg, litros, un" required>
    </div>
    <div class="form-group">
      <label for="ingredient-unitCost">Costo Unitario (S/):</label>
      <input id="ingredient-unitCost" type="number" step="0.01" [(ngModel)]="unitCost" name="unitCost" required>
    </div>
    <button type="submit">Guardar</button>
    <button type="button" routerLink="/pages/ingredient">Cancelar</button>
  </form>
</div>
