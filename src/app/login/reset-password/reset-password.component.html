<div class="register-page">
  <div class="register-brand">
    <app-logo [size]="150" [animated]="true" [showWordmark]="true"></app-logo>
  </div>

  <div class="register-card">
    <h2>Crea tu nueva contraseña</h2>
    <p class="subtitle">El enlace sirve una sola vez y vence a los 30 minutos.</p>

    <div class="error-message" *ngIf="errorMessage">{{ errorMessage }}</div>
    <div class="success-message" *ngIf="successMessage">{{ successMessage }}</div>

    <form (ngSubmit)="onSubmit()" *ngIf="token && !successMessage">
      <div class="form-group">
        <label for="newPassword">Contraseña nueva</label>
        <input type="password" id="newPassword" [(ngModel)]="password" name="password" autocomplete="new-password" required>
      </div>
      <div class="form-group">
        <label for="confirmPassword">Repite la contraseña</label>
        <input type="password" id="confirmPassword" [(ngModel)]="confirm" name="confirm" autocomplete="new-password" required>
      </div>
      <button type="submit" class="submit-btn" [disabled]="saving">{{ saving ? 'Guardando...' : 'Guardar contraseña' }}</button>
    </form>

    <p class="back-note">
      <a routerLink="/login">Volver al inicio de sesión</a>
    </p>
  </div>
</div>
