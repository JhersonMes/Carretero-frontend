# Nginx dentro del contenedor "frontend".
# - Sirve la app Angular compilada.
# - Reenvia /api/* al contenedor "backend" (Spring Boot :8080), quitando el prefijo /api.
#   Asi el navegador solo habla con un origen (sin CORS) y el backend no se publica.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Boletas/fotos que se suben al backend
    client_max_body_size 20m;

    # WebSocket STOMP de comandas/salon: /api/ws -> backend:8080/ws
    location /api/ws {
        proxy_pass http://backend:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # API REST: /api/orders -> backend:8080/orders
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Archivos con hash (js/css): cache larga
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico|webp)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Rutas de Angular (SPA): cualquier ruta desconocida devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
